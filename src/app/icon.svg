<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="ring-grad" x1="100" y1="100" x2="412" y2="412" gradientUnits="userSpaceOnUse">
      <stop class="ring-stop-1" stop-color="#b07563"/>
      <stop class="ring-stop-2" offset="1" stop-color="#77b493"/>
    </linearGradient>
  </defs>
  <style>
    /* Dark Mode (Default) */
    .bg { fill: #03160b; stroke: #202c25; stroke-width: 4px; }
    .ring-stop-1 { stop-color: #b07563; }
    .ring-stop-2 { stop-color: #77b493; }
    .needle-n1 { fill: #77b493; }
    .needle-n2 { fill: #528b6d; }
    .needle-s1 { fill: #916658; }
    .needle-s2 { fill: #b07563; }
    .core-bg { fill: #03160b; stroke: #77b493; }
    .core-dot { fill: #77b493; }

    /* Light Mode */
    @media (prefers-color-scheme: light) {
      .bg { fill: #fcf3f0; stroke: #e1d4d0; }
      .ring-stop-1 { stop-color: #916658; }
      .ring-stop-2 { stop-color: #072014; }
      .needle-n1 { fill: #072014; }
      .needle-n2 { fill: #163827; }
      .needle-s1 { fill: #916658; }
      .needle-s2 { fill: #b07563; }
      .core-bg { fill: #fcf3f0; stroke: #072014; }
      .core-dot { fill: #072014; }
    }
  </style>
  <rect width="512" height="512" rx="120" class="bg"/>
  <circle cx="256" cy="256" r="156" stroke="url(#ring-grad)" stroke-width="22"/>
  <polygon points="256,80 256,224 172,256" class="needle-n1"/>
  <polygon points="256,80 340,256 256,224" class="needle-n2"/>
  <polygon points="256,432 172,256 256,288" class="needle-s1"/>
  <polygon points="256,432 256,288 340,256" class="needle-s2"/>
  <circle cx="256" cy="256" r="28" stroke-width="6" class="core-bg"/>
  <circle cx="256" cy="256" r="12" class="core-dot"/>
</svg>
